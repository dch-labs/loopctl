# Reference consumer workflow, maintained in the difftrace repo
# (examples/difftrace-review.yml). Copy verbatim; on every difftrace
# release bump the two version+checksum pins below. Local deviations:
# the chat job is intentionally memory-less (learnings accumulate from
# the full reviews in the review job), and the memory cache takes its
# SHA segment from github.sha instead of resolving the pull request's
# head SHA in a step.
name: difftrace review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
      model:
        description: "Model to review with"
        required: false

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: Review the pull request
    runs-on: ubuntu-latest
    concurrency:
      # One lane per pull request, shared with the chat job: reviews and
      # comment commands serialize instead of racing the registry,
      # threads, and memory. Queued runs pick up the head at start time.
      group: difftrace-${{ inputs.pr || github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork != true)
    steps:
      - name: Resolve the pull request number
        id: pr
        env:
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number: $PR" >&2; exit 1;; esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Reject fork pull requests
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          fork=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.fork)
          case "$fork" in false) ;; *) echo "difftrace does not run on fork pull requests" >&2; exit 1;; esac

      # The binary is pinned to the tagged v0.7.0 release; bump version and
      # checksum together on every difftrace release.
      - name: Install difftrace v0.7.0
        run: |
          curl -fsSL -o /tmp/difftrace.tar.gz \
            https://github.com/dch-labs/difftrace/releases/download/v0.7.0/difftrace-0.7.0-x86_64-unknown-linux-gnu.tar.gz
          echo "2b4d3228ad75b19f8ede66fa4d8ac8e39af05860a55b193f938ed951a4e93a18  /tmp/difftrace.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/difftrace.tar.gz -C "$HOME/.local/bin"

      - name: Check the required secrets are present
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_APP_ID: ${{ secrets.DIFFTRACE_APP_ID }}
          DIFFTRACE_APP_PRIVATE_KEY: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
        run: |
          : "${ZAI_API_KEY:?ZAI_API_KEY is not set - the review step would fail opaquely}"
          : "${DIFFTRACE_APP_ID:?DIFFTRACE_APP_ID is not set - the review step would fail opaquely}"
          : "${DIFFTRACE_APP_PRIVATE_KEY:?DIFFTRACE_APP_PRIVATE_KEY is not set - the review step would fail opaquely}"

      - name: Mint the difftrace app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.DIFFTRACE_APP_ID }}
          private-key: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write

      - name: Restore the review memory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.difftrace/memory
          key: difftrace-mem-${{ github.repository }}-pr${{ steps.pr.outputs.pr }}-${{ github.sha }}
          restore-keys: |
            difftrace-mem-${{ github.repository }}-pr${{ steps.pr.outputs.pr }}-
            difftrace-mem-${{ github.repository }}-

      - name: Review the pull request
        run: |
          difftrace review --repo "$REPO" --pr "$PR" --memory "$HOME/.difftrace/memory/learnings.md"
        env:
          PR: ${{ steps.pr.outputs.pr }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_PROFILE: zai
          DIFFTRACE_MAX_TOKENS: '32768'
          DIFFTRACE_MODEL: ${{ inputs.model || vars.DIFFTRACE_MODEL || 'glm-4.7' }}
          RUST_LOG: info

      - name: Upload trajectory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: difftrace-trajectory-pr${{ steps.pr.outputs.pr }}
          path: ~/.difftrace/trajectories/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Authorize a difftrace command
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null)
    outputs:
      skip: ${{ steps.cmd.outputs.skip }}
      verb: ${{ steps.cmd.outputs.verb }}
    steps:
      # A comment triggers difftrace only when its first line addresses
      # the bot — quoted mentions deeper in the body never fire.
      - name: Resolve the command
        id: cmd
        env:
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          case "$AUTHOR" in *"[bot]") echo "skip=bot" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if ! printf '%s' "$BODY" | head -n 1 | grep -qiE '^(@difftrace(\[bot\])?|/difftrace)[[:space:]]'; then
            echo "skip=mention" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
          if printf '%s' "$BODY" | head -n 1 | grep -qiE '^(@difftrace(\[bot\])?|/difftrace)[[:space:]]+review([[:space:]]|$)'; then
            echo "verb=review" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$BODY" | head -n 1 | grep -qiE '^(@difftrace(\[bot\])?|/difftrace)[[:space:]]+plan([[:space:]]|$)'; then
            echo "verb=plan" >> "$GITHUB_OUTPUT"
          else
            echo "verb=reply" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorize the command author
        if: steps.cmd.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          case "$AUTHOR" in *[!A-Za-z0-9-]*) echo "invalid comment author login: $AUTHOR" >&2; exit 1;; esac
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number: $PR" >&2; exit 1;; esac
          perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission)
          case "$perm" in admin|write) ;; *) echo "$AUTHOR ($perm) may not trigger difftrace" >&2; exit 1;; esac
          fork=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.fork)
          case "$fork" in false) ;; *) echo "difftrace does not run on fork pull requests" >&2; exit 1;; esac

  chat:
    name: Handle a difftrace command
    # Intentionally memory-less: replies and plans answer the thread at
    # hand; learnings accumulate from the full reviews in the review job.
    needs: gate
    runs-on: ubuntu-latest
    concurrency:
      # Shared with the review job's lane: a re-review command waits for
      # any in-flight review instead of racing it.
      group: difftrace-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    if: needs.gate.outputs.skip == ''
    steps:

      - name: Resolve the pull request number
        id: pr
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number: $PR" >&2; exit 1;; esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      # The binary is pinned to the tagged v0.7.0 release; bump version and
      # checksum together on every difftrace release.
      - name: Install difftrace v0.7.0
        run: |
          curl -fsSL -o /tmp/difftrace.tar.gz \
            https://github.com/dch-labs/difftrace/releases/download/v0.7.0/difftrace-0.7.0-x86_64-unknown-linux-gnu.tar.gz
          echo "2b4d3228ad75b19f8ede66fa4d8ac8e39af05860a55b193f938ed951a4e93a18  /tmp/difftrace.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/difftrace.tar.gz -C "$HOME/.local/bin"

      - name: Check the required secrets are present
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_APP_ID: ${{ secrets.DIFFTRACE_APP_ID }}
          DIFFTRACE_APP_PRIVATE_KEY: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
        run: |
          : "${ZAI_API_KEY:?ZAI_API_KEY is not set - the reply step would fail opaquely}"
          : "${DIFFTRACE_APP_ID:?DIFFTRACE_APP_ID is not set - the reply step would fail opaquely}"
          : "${DIFFTRACE_APP_PRIVATE_KEY:?DIFFTRACE_APP_PRIVATE_KEY is not set - the reply step would fail opaquely}"

      - name: Mint the difftrace app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.DIFFTRACE_APP_ID }}
          private-key: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write

      - name: Run the command
        run: |
          if [ "$VERB" = "review" ]; then
            difftrace review --repo "$REPO" --pr "$PR"
          elif [ "$VERB" = "plan" ] && [ "$COMMENT_KIND" = "review" ]; then
            difftrace plan --repo "$REPO" --pr "$PR" --review-comment "$COMMENT_ID"
          elif [ "$COMMENT_KIND" = "issue" ]; then
            difftrace reply --repo "$REPO" --pr "$PR" --issue-comment "$COMMENT_ID"
          else
            difftrace reply --repo "$REPO" --pr "$PR" --review-comment "$COMMENT_ID"
          fi
        env:
          VERB: ${{ needs.gate.outputs.verb }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_KIND: ${{ github.event_name == 'issue_comment' && 'issue' || 'review' }}
          PR: ${{ steps.pr.outputs.pr }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_PROFILE: zai
          DIFFTRACE_MAX_TOKENS: '32768'
          DIFFTRACE_MODEL: ${{ inputs.model || vars.DIFFTRACE_MODEL || 'glm-4.7' }}
          RUST_LOG: info

      - name: Upload trajectory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: difftrace-trajectory-pr${{ steps.pr.outputs.pr }}-chat
          path: ~/.difftrace/trajectories/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
