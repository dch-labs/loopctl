# Caller template for the difftrace review workflow
# (dch-labs/difftrace/.github/workflows/review.yml). Copy verbatim; on
# every difftrace release, bump the ref in the uses: line below — the
# `release.sh pins` command in the difftrace repo prints the exact
# line to copy, a fixed commit carrying the release's binary
# version+checksum pins.
#
# What the pinned callee enforces on its side — the jobs are not in this
# file: fork and dependabot pull requests are rejected; command authors
# must be collaborators with write; required secrets fail fast with
# named messages; the binary is checksum-pinned; all writes go through
# a least-privilege app token; concurrency lanes are callee-side too
# — pushes supersede in-flight reviews and commands queue without
# dropping.
name: difftrace review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
      model:
        description: "Model to review with"
        required: false

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    uses: dch-labs/difftrace/.github/workflows/review.yml@ea6c910f22707185e025b6c7bb2cc1c25a07ade6 # v0.11.2
    with:
      pr: ${{ github.event.pull_request.number || (github.event.issue.pull_request != null && github.event.issue.number) || inputs.pr }}
      model: ${{ inputs.model }}
    secrets:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DIFFTRACE_APP_ID: ${{ secrets.DIFFTRACE_APP_ID }}
      DIFFTRACE_APP_PRIVATE_KEY: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
