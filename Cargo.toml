[package]
name = "loopctl"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A trait-based framework for building agent loops with pluggable LLM clients, tools, and memory"
repository = "https://github.com/dch-sh/loopctl"
homepage = "https://github.com/dch-sh/loopctl"
documentation = "https://docs.rs/loopctl"
keywords = ["agent", "framework", "llm", "loop"]
categories = ["asynchronous", "api-bindings", "development-tools"]
readme = "README.md"
rust-version = "1.85"

[lib]
name = "loopctl"
path = "src/lib.rs"

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
proptest = "1"

[features]
default = []
testing = []
