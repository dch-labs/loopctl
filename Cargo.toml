[package]
name = "loopctl"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A trait-based framework for building agent loops with pluggable LLM clients, tools, and memory"
repository = "https://github.com/dch-labs/loopctl"
homepage = "https://loopctl.rs"
documentation = "https://docs.rs/loopctl"
keywords = ["agent", "framework", "llm", "loop"]
categories = ["api-bindings", "development-tools"]
exclude = ["tests/cassettes/**"]
readme = "README.md"
rust-version = "1.98"

[workspace]
members = ["derive", "sqlite"]

[lib]
name = "loopctl"
path = "src/lib.rs"

[dependencies]
futures = "0.3"
loopctl-derive = { path = "derive", version = "=0.3.2", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"
tokio = { version = "1.52.3", features = ["rt", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"], optional = true }
bytes = { version = "1", optional = true }
async-stream = { version = "0.3", optional = true }
httpdate = { version = "1", optional = true }
jsonschema = { version = "0.56", optional = true }
regex = { version = "1", optional = true, default-features = false, features = ["std"] }
base64 = { version = "0.22", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
schemars = { version = "1.2", optional = true }
rmcp = { version = "3.4", optional = true, default-features = false, features = ["client", "server", "macros", "transport-async-rw", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-io"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
proptest = "1"
httpmock = { version = "0.8.3", default-features = false, features = ["record"] }
serde_yaml = "0.9"

[features]
default = []
builtin_tools = ["dep:base64"]
vector_index = []
derive = ["dep:loopctl-derive"]
hooks = []
testing = []
file_memory = []
tool_health = []
tool_shield = ["tool_health"]
streaming = ["dep:async-stream"]
schema_validation = ["dep:jsonschema"]
redaction = ["dep:regex", "regex/unicode-case", "regex/unicode-perl"]
manifest = ["dep:serde_yaml_ng", "dep:schemars"]
mcp = ["dep:rmcp", "streaming", "dep:reqwest", "dep:jsonschema"]

# Providers
providers = ["dep:reqwest", "dep:httpdate", "dep:bytes"]
openai = ["providers", "streaming"]
anthropic = ["providers", "streaming"]
ollama = ["providers", "openai"]
deepseek = ["providers", "openai"]
azure = ["providers", "openai"]
moonshot = ["providers", "openai"]
bedrock = ["providers", "streaming", "anthropic", "dep:hmac", "dep:sha2", "dep:hex"]
grok = ["providers", "openai"]
xai = ["grok"]
gemini = ["providers", "streaming"]
zai = ["providers", "anthropic"]
grammar = ["providers"]

[[example]]
name = "hello-cli"
required-features = ["testing"]

[[example]]
name = "vector-index-demo"
required-features = ["vector_index"]

[[example]]
name = "derived-tool-cli"
required-features = ["derive", "testing"]

[[example]]
name = "repl-cli"
required-features = ["testing"]

[[example]]
name = "echo-tool-cli"
required-features = ["testing"]

[[example]]
name = "file-memory-cli"
required-features = ["file_memory"]

[[example]]
name = "chat"
required-features = ["testing", "providers"]

[[example]]
name = "mcp-adapter"
required-features = ["mcp"]

[[example]]
name = "mcp-stdio-server"
required-features = ["mcp"]

[[example]]
name = "mcp_server"
required-features = ["mcp"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

