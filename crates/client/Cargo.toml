[package]
name = "loopctl-client"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "The shared daemon client for the loopctl family: typed verbs, event streams, and the versioned handshake over the unix socket"
repository = "https://github.com/dch-labs/loopctl"
homepage = "https://loopctl.rs"
keywords = ["agent", "loopctl", "client", "daemon", "ipc"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
loopctl = { path = "../..", version = "=0.4.0", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.3", features = ["net", "io-util", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
loopctl = { path = "../..", version = "=0.4.0", default-features = false, features = ["testing"] }
tempfile = "3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"
