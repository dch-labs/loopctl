[package]
name = "loopctl-langfuse"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Langfuse (LLM observability) exporter for loopctl agent loops — native traces, sessions, and scores"
repository = "https://github.com/dch-labs/loopctl"
homepage = "https://loopctl.rs"
keywords = ["langfuse", "observability", "tracing", "agent", "llm"]
categories = ["development-tools::debugging", "api-bindings"]

[dependencies]
loopctl = { path = "../..", version = "=0.5.0", default-features = false, features = ["metrics"] }
base64 = "0.23"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[dev-dependencies]
loopctl = { path = "../..", version = "=0.5.0", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"
