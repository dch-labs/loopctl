[package]
name = "loopctl-otel"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "OpenTelemetry (OTLP) exporter for loopctl agent loops — GenAI-shaped spans for Jaeger/Tempo/Honeycomb"
repository = "https://github.com/dch-labs/loopctl"
homepage = "https://loopctl.rs"
keywords = ["opentelemetry", "otel", "tracing", "agent", "llm"]
categories = ["development-tools::debugging", "api-bindings"]

[dependencies]
loopctl = { path = "../..", version = "=0.5.0", default-features = false, features = ["metrics"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["trace", "metrics", "http-proto"] }
tracing-opentelemetry = "0.34"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
thiserror = "2"

[dev-dependencies]
loopctl = { path = "../..", version = "=0.5.0", features = ["testing"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
grpc = ["opentelemetry-otlp/grpc-tonic"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"
