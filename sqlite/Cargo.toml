[package]
name = "loopctl-sqlite"
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "SQLite-backed LoopMemory implementation for loopctl"
repository = "https://github.com/dch-labs/loopctl"
keywords = ["agent", "loopctl", "sqlite", "memory"]
categories = ["api-bindings", "database"]

[dependencies]
loopctl = { path = "..", version = "=0.3.1" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = "1"

[dev-dependencies]
loopctl = { path = "..", version = "=0.3.1", features = ["file_memory"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"
